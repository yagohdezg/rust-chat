# deploy/compose.yaml — full rust-chat stack for local/live testing.
#
#   podman compose -f deploy/compose.yaml up --build -d      # or `docker compose`
#
# Services: chat-server (API, SSE) + web (SvelteKit). The database defaults to
# SQLite (a file on the `sqlite_data` volume, no extra service). To use Postgres
# instead, start its profile and point chat-server at it:
#   RUSTCHAT_DB_BACKEND=postgres \
#   RUSTCHAT_DATABASE_URL=postgres://rustchat:rustchat@postgres:5432/rustchat \
#   podman compose -f deploy/compose.yaml --profile postgres up --build -d
#
# Code execution runs through the standalone `sandboxd` service, which drives a
# BoxLite server. Enable both with `--profile sandboxd`: that starts a `boxlite`
# container (privileged, with /dev/kvm passed through) plus `sandboxd`.
# chat-server holds no in-process backend and fails closed if sandboxd is
# unreachable. See README.
#
# Configuration is read from `deploy/.env` (see deploy/.env.example) or the
# ambient environment; every value below has a sensible default.

name: rust-chat

services:
  # Optional Postgres backend. Enable with `--profile postgres` and set
  # RUSTCHAT_DB_BACKEND=postgres + RUSTCHAT_DATABASE_URL on chat-server. SQLite
  # is the default and needs no service.
  postgres:
    profiles: ["postgres"]
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rustchat
      POSTGRES_PASSWORD: rustchat
      POSTGRES_DB: rustchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustchat -d rustchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-server:
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      args:
        SERVICE: chat-server
    restart: unless-stopped
    environment:
      # SQLite by default, stored at /data/db on the `sqlite_data` volume. These
      # use RUSTCHAT_-prefixed names so a developer `.env` for `cargo run`
      # (which sets a relative `DATABASE_URL`) cannot leak into the container
      # and write the database to the ephemeral container filesystem.
      # For Postgres: set RUSTCHAT_DB_BACKEND=postgres and
      # RUSTCHAT_DATABASE_URL=postgres://rustchat:rustchat@postgres:5432/rustchat,
      # then start the `postgres` profile.
      DB_BACKEND: ${RUSTCHAT_DB_BACKEND:-sqlite}
      DATABASE_URL: ${RUSTCHAT_DATABASE_URL:-sqlite:///data/db/rustchat.db}
      BIND_ADDR: 0.0.0.0:3080
      # Required (>= 32 chars). Compose fails fast with a clear message if unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env (openssl rand -base64 48)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Browser origin of the web service; keep in sync with WEB_ORIGIN.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-60}
      # File storage: `local` (default) or `s3` (requires the `s3` profile).
      FILE_STORAGE_KIND: ${FILE_STORAGE_KIND:-local}
      FILE_STORAGE_DIR: /data/files
      S3_BUCKET: ${S3_BUCKET:-rustchat}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # Credentials for the S3 backend (matched to MinIO below by default).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-rustchat}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
      # Execution goes through sandboxd (profile `sandboxd`). The token must
      # match sandboxd's SANDBOXD_TOKEN.
      SANDBOXD_URL: ${SANDBOXD_URL:-http://sandboxd:3081}
      SANDBOXD_TOKEN: ${SANDBOXD_TOKEN:-}
      # Agent runtime: expose `execute_code` to the model (off by default).
      # With COMPUTERS_ENABLED, it runs on the caller's per-user computer.
      SANDBOX_TOOL_ENABLED: ${SANDBOX_TOOL_ENABLED:-false}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-6}
      # Per-user persistent computers (§4b). Off by default; requires the
      # `sandboxd` profile. SANDBOX_NODES defaults to a single node at
      # SANDBOXD_URL when unset.
      COMPUTERS_ENABLED: ${COMPUTERS_ENABLED:-false}
      SANDBOX_NODES: ${SANDBOX_NODES:-}
      COMPUTER_IDLE_TTL_SECONDS: ${COMPUTER_IDLE_TTL_SECONDS:-1800}
      COMPUTER_REAP_INTERVAL_SECONDS: ${COMPUTER_REAP_INTERVAL_SECONDS:-60}
      COMPUTER_WARM_POOL: ${COMPUTER_WARM_POOL:-0}
    ports:
      - "3080:3080"
    volumes:
      # SQLite database (when DB_BACKEND=sqlite) and uploaded files.
      - sqlite_data:/data/db
      - file_data:/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # Baked into the browser bundle; must be reachable from the browser.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3080}
    restart: unless-stopped
    depends_on:
      - chat-server
    environment:
      ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "5173:3000"

  # BoxLite REST server (`boxlite serve`), used by sandboxd. Enable with
  # `--profile sandboxd`.
  #
  # BoxLite starts a microVM per box, so it needs the host's KVM device and
  # runs privileged. Point BOXLITE_URL at an external `boxlite serve` instead
  # if you do not want it in this stack.
  boxlite:
    profiles: ["sandboxd"]
    build:
      context: ..
      dockerfile: deploy/docker/boxlite.Dockerfile
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    volumes:
      # Cached OCI images, guest kernel and box state.
      - boxlite_data:/root/.boxlite
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/v1/config >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Standalone BoxLite exec service. Enable with `--profile sandboxd`.
  # Reaches `boxlite` by service name; set BOXLITE_URL to use an external
  # BoxLite instead.
  sandboxd:
    profiles: ["sandboxd"]
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      args:
        SERVICE: sandboxd
    depends_on:
      boxlite:
        condition: service_healthy
    environment:
      SANDBOXD_BIND_ADDR: 0.0.0.0:3081
      # Mandatory: sandboxd refuses to start without it. Must match
      # chat-server's SANDBOXD_TOKEN.
      SANDBOXD_TOKEN: ${SANDBOXD_TOKEN:-}
      BOXLITE_URL: ${BOXLITE_URL:-http://boxlite:8100}
      BOXLITE_TOKEN: ${BOXLITE_TOKEN:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-30}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-false}
      SANDBOX_EGRESS_ALLOW: ${SANDBOX_EGRESS_ALLOW:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3081:3081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional S3-compatible object storage for multi-replica deployments.
  # Enable with `--profile s3`, then run chat-server with:
  #   FILE_STORAGE_KIND=s3 S3_ENDPOINT=http://minio:9000
  # MinIO is free to self-host; see the README for managed free tiers
  # (Cloudflare R2, Backblaze B2, ...).
  minio:
    profiles: ["s3"]
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rustchat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO does not create buckets automatically; this one-shot helper does.
  createbuckets:
    profiles: ["s3"]
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-rustchat}" "${MINIO_ROOT_PASSWORD:-rustchat-secret}" &&
        mc mb --ignore-existing "local/${S3_BUCKET:-rustchat}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rustchat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
      S3_BUCKET: ${S3_BUCKET:-rustchat}

volumes:
  sqlite_data:
  pgdata:
  file_data:
  minio_data:
  boxlite_data:
