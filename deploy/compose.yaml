# deploy/compose.yaml — full rust-chat stack for local/live testing.
#
#   podman compose -f deploy/compose.yaml up --build -d      # or `docker compose`
#
# Services: postgres (pgvector) + chat-server (API, SSE, RAG) + web (SvelteKit).
#
# The sandbox (Podman microVM-less containers / BoxLite microVMs) is NOT part of
# this stack: PodmanBackend bind-mounts a scratch dir into a container runtime on
# the *host*, and BoxLiteBackend needs a hypervisor. Run those on the host, or
# point SANDBOX_BACKEND=boxlite at a reachable `boxlite serve`. See README.
#
# Configuration is read from `deploy/.env` (see deploy/.env.example) or the
# ambient environment; every value below has a sensible default.

name: rust-chat

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rustchat
      POSTGRES_PASSWORD: rustchat
      POSTGRES_DB: rustchat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustchat -d rustchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-server:
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      args:
        SERVICE: chat-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgres://rustchat:rustchat@postgres:5432/rustchat
      BIND_ADDR: 0.0.0.0:3080
      # Required (>= 32 chars). Compose fails fast with a clear message if unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env (openssl rand -base64 48)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS:-2592000}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Browser origin of the web service; keep in sync with WEB_ORIGIN.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-30}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-60}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # File storage: `local` (default) or `s3` (requires the `s3` profile).
      FILE_STORAGE_KIND: ${FILE_STORAGE_KIND:-local}
      FILE_STORAGE_DIR: /data/files
      S3_BUCKET: ${S3_BUCKET:-rustchat}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # Credentials for the S3 backend (matched to MinIO below by default).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-rustchat}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
      # Sandbox is unavailable in-container; leave it be or point at BoxLite.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-podman}
      BOXLITE_URL: ${BOXLITE_URL:-http://host.docker.internal:8100}
    ports:
      - "3080:3080"
    volumes:
      - file_data:/data/files
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        # Baked into the browser bundle; must be reachable from the browser.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3080}
    restart: unless-stopped
    depends_on:
      - chat-server
    environment:
      ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports:
      - "5173:3000"

  # Optional standalone exec service. Enable with `--profile sandboxd`.
  # Point it at an external BoxLite server; do not expect host-container
  # bind mounts to work from inside a container.
  sandboxd:
    profiles: ["sandboxd"]
    build:
      context: ..
      dockerfile: deploy/docker/rust.Dockerfile
      args:
        SERVICE: sandboxd
    environment:
      SANDBOXD_BIND_ADDR: 0.0.0.0:3081
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-boxlite}
      BOXLITE_URL: ${BOXLITE_URL:-http://host.docker.internal:8100}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-python:3.12-slim}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "3081:3081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional S3-compatible object storage for multi-replica deployments.
  # Enable with `--profile s3`, then run chat-server with:
  #   FILE_STORAGE_KIND=s3 S3_ENDPOINT=http://minio:9000
  # MinIO is free to self-host; see the README for managed free tiers
  # (Cloudflare R2, Backblaze B2, ...).
  minio:
    profiles: ["s3"]
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rustchat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO does not create buckets automatically; this one-shot helper does.
  createbuckets:
    profiles: ["s3"]
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000
        "${MINIO_ROOT_USER:-rustchat}" "${MINIO_ROOT_PASSWORD:-rustchat-secret}" &&
        mc mb --ignore-existing "local/${S3_BUCKET:-rustchat}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rustchat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rustchat-secret}
      S3_BUCKET: ${S3_BUCKET:-rustchat}

volumes:
  pgdata:
  file_data:
  minio_data:
